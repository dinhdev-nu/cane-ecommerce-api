# Draft for a Linux VM. Use a separate secret env file; never the local dev.env.
name: cane-wp01-staging
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_USER: cane_staging_admin
      POSTGRES_DB: cane_staging
      POSTGRES_PASSWORD: ${CANE_STAGING_POSTGRES_ADMIN_PASSWORD:?Missing staging admin secret}
      CANE_MIGRATION_PASSWORD: ${CANE_STAGING_MIGRATION_PASSWORD:?Missing staging migrator secret}
      CANE_API_DB_PASSWORD: ${CANE_STAGING_API_DB_PASSWORD:?Missing staging API secret}
      CANE_WORKER_DB_PASSWORD: ${CANE_STAGING_WORKER_DB_PASSWORD:?Missing staging worker secret}
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-roles.sql:/docker-entrypoint-initdb.d/10-cane-staging-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cane_staging_admin -d cane_staging"]
      interval: 5s
      timeout: 2s
      retries: 24
    labels:
      vn.cane.scope: wp01-staging
  redis:
    image: redis:8.10.3@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
    restart: unless-stopped
    user: redis
    environment:
      CANE_REDIS_PASSWORD: ${CANE_STAGING_REDIS_PASSWORD:?Missing staging Redis secret}
    command: ["/bin/sh", "/usr/local/bin/cane-staging-redis.sh"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./redis-start.sh:/usr/local/bin/cane-staging-redis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CANE_REDIS_PASSWORD redis-cli --user cane_runtime ping | grep -q PONG"]
      interval: 5s
      timeout: 2s
      retries: 24
    labels:
      vn.cane.scope: wp01-staging
volumes:
  postgres-data:
    labels:
      vn.cane.scope: wp01-staging
networks:
  default:
    labels:
      vn.cane.scope: wp01-staging
