name: cane-prep02-local
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: cane_prep_admin
      POSTGRES_DB: cane_local
      POSTGRES_PASSWORD: ${CANE_POSTGRES_ADMIN_PASSWORD:?Generate the local environment first}
      CANE_MIGRATION_PASSWORD: ${CANE_MIGRATION_PASSWORD:?Missing migration secret}
      CANE_API_DB_PASSWORD: ${CANE_API_DB_PASSWORD:?Missing API secret}
      CANE_WORKER_DB_PASSWORD: ${CANE_WORKER_DB_PASSWORD:?Missing worker secret}
    ports:
      - "127.0.0.1:${CANE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/dev/init-roles.sql:/docker-entrypoint-initdb.d/10-cane-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cane_prep_admin -d cane_local"]
      interval: 2s
      timeout: 2s
      retries: 30
    labels:
      vn.cane.scope: prep02-local
  redis:
    image: redis:8.10.3@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
    user: redis
    environment:
      CANE_REDIS_PASSWORD: ${CANE_REDIS_PASSWORD:?Missing Redis secret}
    command: ["/bin/sh", "/usr/local/bin/cane-redis.sh"]
    ports:
      - "127.0.0.1:${CANE_REDIS_PORT:-16379}:6379"
    volumes:
      - ./scripts/dev/redis-start.sh:/usr/local/bin/cane-redis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CANE_REDIS_PASSWORD redis-cli --user cane_runtime ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
    labels:
      vn.cane.scope: prep02-local
volumes:
  postgres-data:
    labels:
      vn.cane.scope: prep02-local
networks:
  default:
    labels:
      vn.cane.scope: prep02-local
